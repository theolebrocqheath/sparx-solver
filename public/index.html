<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparx Solver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Sparx Solver</h1>
      <p class="subtitle">Automate your Sparx homework</p>
    </header>

    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
      <div class="card">
        <h2>Log In</h2>
        <form id="login-form">
          <div class="field">
            <label for="school">School</label>
            <div class="school-search">
              <input type="text" id="school" placeholder="Start typing your school name..." autocomplete="off" required>
              <div id="school-dropdown" class="dropdown hidden"></div>
            </div>
            <input type="hidden" id="school-slug">
          </div>
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Your Sparx username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your Sparx password" required>
          </div>
          <button type="submit" id="login-btn">
            <span class="btn-text">Log In</span>
            <span class="spinner hidden"></span>
          </button>
        </form>

        <div class="divider"><span>or</span></div>

        <button id="google-btn" class="btn-google" disabled>
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
          <span>Log in with Google</span>
        </button>
        <p class="google-hint hidden" id="google-hint">Select a school first to enable Google login</p>

        <p id="login-error" class="error hidden"></p>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-screen" class="screen">
      <div class="top-bar">
        <div>
          <span class="greeting">Hello, <strong id="student-name"></strong></span>
          <span class="module-badge" id="module-badge">maths</span>
        </div>
        <button id="logout-btn" class="btn-secondary">Log Out</button>
      </div>

      <div class="card">
        <h2>Your Homework</h2>
        <div id="homework-loading" class="loading">Loading homework...</div>
        <div id="homework-list" class="hidden"></div>
        <p id="homework-empty" class="muted hidden">No homework found. You might be all caught up!</p>
      </div>
    </div>

    <!-- Solver -->
    <div id="solver-screen" class="screen">
      <button id="back-btn" class="btn-secondary">&larr; Back to Homework</button>
      <div class="card">
        <h2 id="task-title">Solving...</h2>
        <div class="stats-row">
          <div class="stat">
            <span class="stat-num" id="stat-solved">0</span>
            <span class="stat-label">Solved</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="stat-failed">0</span>
            <span class="stat-label">Skipped</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="stat-current">0</span>
            <span class="stat-label">Current Q</span>
          </div>
        </div>
        <div id="progress-bar-container">
          <div id="progress-bar"></div>
        </div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
